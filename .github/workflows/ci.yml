name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: &shared_ignore
      - '**.md'
      - '.clang-format'
      - '.gitignore'
      
  pull_request:
    branches: ["main"]
    paths-ignore: *shared_ignore

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            toolchain: Clang
            xmake_flags: --toolchain=clang

          - os: Windows
            runner: windows-latest
            toolchain: MSVC
            xmake_flags: --toolchain=msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xmake setup
      - name: Install XMake
        uses: xmake-io/github-action-setup-xmake@v1
        timeout-minutes: 3
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ci-${{ matrix.os }}'
          package-cache: false

      # LLVM/Clang setup
      - name: Install LLVM/Clang
        if: matrix.toolchain == 'Clang'
        run: | 
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all

          LLVM_PATH="/usr/lib/llvm-19/bin"
          if [ -d "$LLVM_PATH" ]; then
            echo "Found LLVM install directory. Adding to GITHUB_PATH..."
            echo "$LLVM_PATH" >> $GITHUB_PATH
          else
            echo "::error::Couldn't find LLVM install directory at $LLVM_PATH! Installation may have failed."
            exit 1
          fi
          
      # Build
      - name: Build Debug
        run: | 
          xmake config -y -m debug ${{ matrix.xmake_flags }}
          xmake build -y

      - name: Build Release
        run: | 
          xmake config -y -m release ${{ matrix.xmake_flags }}
          xmake build -y
