name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            toolchain: Clang
            xmake_flags: --toolchain=clang

          - os: Windows
            runner: windows-latest
            toolchain: MSVC
            xmake_flags: --toolchain=msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xmake setup
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ci-${{ matrix.os }}'
          package-cache: true
          package-cache-key: 'ci-${{ matrix.os }}'

      # LLVM/Clang setup
      - name: Install LLVM/Clang
        if: matrix.toolchain == 'Clang'
        run: | 
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all

      # Temporary
      - name: Find LLVM installation
        if: matrix.toolchain == 'Clang'
        run: |
          which clang-19 || true
          find /usr -name "clang-19" 2>/dev/null
          find /usr/lib -maxdepth 2 -name "llvm*" -type d 2>/dev/null
          find /usr -name "libc++.modules.json" 2>/dev/null

      #- name: Set Clang PATH
      #  if: matrix.toolchain == 'Clang'
      #  run: echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH
        
      # Build
      - name: Configure
        run: xmake f -y ${{ matrix.xmake_flags }}

      - name: Build
        run: xmake build -y
