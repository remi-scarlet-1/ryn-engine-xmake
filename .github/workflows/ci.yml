name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            toolchain: Clang
            xmake_flags: --toolchain=clang

          - os: Windows
            runner: windows-latest
            toolchain: MSVC
            xmake_flags: --toolchain=msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xmake setup
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ci-${{ matrix.os }}'
          package-cache: true
          package-cache-key: 'ci-${{ matrix.os }}'

      # Dependencies for build
      - name: Install Clang dependencies
        if: matrix.toolchain == 'Clang'
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev
        
      # Build
      - name: Configure
        run: xmake f -y ${{ matrix.xmake_flags }}

      - name: Build
        run: xmake build -y
