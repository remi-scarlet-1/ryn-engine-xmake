name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false 
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            toolchain: Clang
            xmake_flags: --toolchain=clang

          - os: Windows
            runner: windows-latest
            toolchain: MSVC
            xmake_flags: --toolchain=msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xmake setup
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ci-${{ matrix.os }}'
          package-cache: true
          package-cache-key: 'ci-${{ matrix.os }}'

      # LLVM/Clang setup
      - name: Install LLVM/Clang
        if: matrix.toolchain == 'Clang'
        run: | 
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all

      - name: Verify and Set LLVM PATH
        if: matrix.toolchain == 'Clang'
        run: |
          LLVM_PATH="/usr/lib/llvm-19/bin"
          if [ -d "$LLVM_PATH" ]; then
            echo "Directory exists. Adding to GITHUB_PATH..."
            echo "$LLVM_PATH" >> $GITHUB_PATH
          else
            echo "::error::LLVM directory $LLVM_PATH not found! Installation may have failed."
            exit 1
          fi
        
      # Build
      - name: Configure
        run: xmake f -y ${{ matrix.xmake_flags }}

      - name: Build
        run: xmake build -y
